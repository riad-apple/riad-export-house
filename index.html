 as THREE from 'three';let scene=new THREE.Scene();let camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,100);camera.position.set(0,0.3,2.8);let renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);document.getElementById('c').appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,0.8));let dl=new THREE.DirectionalLight(0xffffff,1);dl.position.set(2,3,2);scene.add(dl);function mk(col){let g=new THREE.Group();let s=new THREE.Shape();s.moveTo(-0.7,-0.8);s.lineTo(0.7,-0.8);s.lineTo(0.65,0.55);s.lineTo(0.9,0.68);s.lineTo(0.48,0.88);s.lineTo(0,1);s.lineTo(-0.48,0.88);s.lineTo(-0.9,0.68);s.lineTo(-0.65,0.55);s.lineTo(-0.7,-0.8);let geo=new THREE.ShapeGeometry(s,20);let p=geo.attributes.position;for(let i=0;i<p.count;i++)p.setZ(i,Math.sin(p.getX(i)*6)*0.03);p.needsUpdate=true;geo.computeVertexNormals();let mat=new THREE.MeshStandardMaterial({color:col,roughness:0.85,side:THREE.DoubleSide});g.add(new THREE.Mesh(geo,mat));let coll=new THREE.Mesh(new THREE.TorusGeometry(0.28,0.04,12,30,Math.PI*1.8),mat);coll.rotation.x=1.57;coll.rotation.z=2.8;coll.position.set(0,0.73,0.05);g.add(coll);return g}let shirt=mk("#4A5D4E");scene.add(shirt);let t=0,d=false,lx=0;addEventListener('mousedown',e=>{d=true;lx=e.clientX});addEventListener('mousemove',e=>{if(!d)return;t+=(e.clientX-lx)*0.01;lx=e.clientX});addEventListener('mouseup',()=>d=false);addEventListener('touchstart',e=>{d=true;lx=e.touches[0].clientX},{passive:false});addEventListener('touchmove',e=>{e.preventDefault();if(!d)return;t+=(e.touches[0].clientX-lx)*0.01;lx=e.touches[0].clientX},{passive:false});addEventListener('touchend',()=>d=false);document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{document.querySelectorAll('.dot').forEach(x=>x.classList.remove('active'));b.classList.add('active');scene.remove(shirt);shirt=mk(b.dataset.c);scene.add(shirt)});(function an(){requestAnimationFrame(an);if(!d)t+=0.003;shirt.rotation.y=t;shirt.rotation.x=Math.sin(Date.now()*0.001)*0.05;renderer.render(scene,camera)})();</script></body></html>
