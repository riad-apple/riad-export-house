<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>RIAD EXPORT HOUSE</title><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;overflow:hidden;touch-action:none}#c{position:fixed;inset:0}.controls{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.1);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);padding:12px 16px;border-radius:100px;display:flex;gap:12px;z-index:10}.dot{width:36px;height:36px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.2s}.dot.active{border-color:#fff;transform:scale(1.2)}</style></head><body><div id="c"></div><div class="controls"><div class="dot active" style="background:#4A5D4E" data-c="#4A5D4E"></div><div class="dot" style="background:#111" data-c="#111"></div><div class="dot" style="background:#E9E1D1" data-c="#E9E1D1"></div><div class="dot" style="background:#1A2F4A" data-c="#1A2F4A"></div></div><script type="module">import * as THREE from 'three';let scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0a0a);let camera=new THREE.PerspectiveCamera(24,innerWidth/innerHeight,0.1,100);camera.position.set(0,0.2,4.5);let renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.getElementById('c').appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,1.1));let dl=new THREE.DirectionalLight(0xffffff,1);dl.position.set(3,4,3);scene.add(dl);let dl2=new THREE.DirectionalLight(0xffffff,0.5);dl2.position.set(-3,2,-2);scene.add(dl2);let rail=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,4.2,16),new THREE.MeshStandardMaterial({color:0x555555,metalness:0.9,roughness:0.2}));rail.rotation.z=Math.PI/2;rail.position.set(0,1.4,0);scene.add(rail);function makeShirt(col,x){let g=new THREE.Group();g.position.set(x,0.35,0);let hook=new THREE.Mesh(new THREE.TorusGeometry(0.08,0.015,6,16,Math.PI),new THREE.MeshStandardMaterial({color:0x777777,metalness:0.8}));hook.rotation.z=Math.PI;hook.position.set(0,0.95,0);let s=new THREE.Shape();s.moveTo(-0.38,-0.55);s.lineTo(0.38,-0.55);s.lineTo(0.35,0.32);s.lineTo(0.52,0.4);s.lineTo(0.26,0.55);s.lineTo(0,0.62);s.lineTo(-0.26,0.55);s.lineTo(-0.52,0.4);s.lineTo(-0.35,0.32);s.lineTo(-0.38,-0.55);let geo=new THREE.ShapeGeometry(s,16);geo.computeVertexNormals();let mat=new THREE.MeshStandardMaterial({color:col,roughness:0.85,side:THREE.DoubleSide});let mesh=new THREE.Mesh(geo,mat);let collar=new THREE.Mesh(new THREE.TorusGeometry(0.16,0.022,8,20,Math.PI*1.8),mat);collar.rotation.x=1.57;collar.rotation.z=2.8;collar.position.set(0,0.53,0.02);g.add(hook,mesh,collar);g.userData.baseX=x;g.userData.rot=0;return g}let cols=["#4A5D4E","#111111","#E9E1D1","#1A2F4A"];let shirts=[];let xs=[-1.2,-0.4,0.4,1.2];xs.forEach((x,i)=>{let s=makeShirt(cols[i],x);shirts.push(s);scene.add(s)});let ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),selected=null,d=false,lx=0,tx=0;function onDown(cx,cy){d=true;lx=cx;mouse.x=(cx/innerWidth)*2-1;mouse.y=-(cy/innerHeight)*2+1;ray.setFromCamera(mouse,camera);let inter=ray.intersectObjects(shirts.map(g=>g.children[1]).flat(),false);if(inter.length>0){selected=shirts.find(s=>s.children.includes(inter[0].object)||s.children[1]==inter[0].object);if(selected)selected.userData.vel=(Math.random()-0.5)*0.3}}function onMove(cx){if(!d)return;let dx=(cx-lx)*0.01;tx+=dx;lx=cx;if(selected)selected.userData.rot+=dx*2;else shirts.forEach(s=>s.userData.rot+=dx)}addEventListener('mousedown',e=>onDown(e.clientX,e.clientY));addEventListener('mousemove',e=>onMove(e.clientX));addEventListener('mouseup',()=>{d=false;selected=null});addEventListener('touchstart',e=>onDown(e.touches[0].clientX,e.touches[0].clientY),{passive:false});addEventListener('touchmove',e=>{e.preventDefault();onMove(e.touches[0].clientX)},{passive:false});addEventListener('touchend',()=>{d=false;selected=null});document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{document.querySelectorAll('.dot').forEach(x=>x.classList.remove('active'));b.classList.add('active');let nc=b.dataset.c;shirts.forEach(s=>{s.children[1].material.color.set(nc);s.children[2].material.color.set(nc);s.userData.vel=(Math.random()-0.5)*0.5})});let clock=0;(function loop(){requestAnimationFrame(loop);clock+=0.01;shirts.forEach((s,i)=>{if(!d||selected!==s){s.userData.rot+=(s.userData.vel||0);if(s.userData.vel)s.userData.vel*=0.97;if(!selected)s.userData.rot+=0.002*Math.sin(clock+i)}s.rotation.y=s.userData.rot;s.position.y=0.35+Math.sin(clock*0.8+i)*0.03;s.rotation.x=Math.sin(clock*0.6+i)*0.04});if(!d&&!selected)tx+=0.001;camera.position.x=Math.sin(tx*0.3)*0.2;camera.lookAt(0,0.3,0);renderer.render(scene,camera)})();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
